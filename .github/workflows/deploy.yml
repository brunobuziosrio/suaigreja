name: Deploy producao VPS

on:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run secrets:check
      - run: npm run lint
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
  deploy:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy via webhook
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://suaigreja.top/deploy-hook \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}")
          echo "status=$status"
          test "$status" = "202"
